# Configuration for `cargo audit`, run by .github/workflows/audit.yml.
#
# Every entry needs the four things the consuming repo's dependency-audit methodology
# requires of a suppression: the concrete blocker, the reachability position, the exit
# condition, and where the work is tracked. A bare advisory URL is not a justification.

[advisories]
ignore = [
    # quick-xml 0.39.4, via this crate's own `quick-xml = "0.39.0"` (Cargo.toml, `cloud` feature).
    # Both advisories are parser denial-of-service, not memory unsafety.
    #
    # Reachability: exercised. This is the XML parser for S3 ListBucket and Azure list
    # responses, so it runs on data returned by the remote object store on ordinary reads.
    # That is a stronger position than the sibling paths through `opendal`, which are
    # compiled but never called by the consumer.
    #
    # Blocker: the fix is quick-xml 0.41.0, a semver-incompatible bump of the parser that
    # backs the AWS and Azure list paths. Upstream `object_store` 0.14.1 already requires
    # `quick-xml ^0.41.0`, so the supported route is adopting that release rather than
    # patching the bump into this fork.
    #
    # Exit: adopt upstream object_store 0.14.1+, or bump quick-xml to 0.41 here and
    # re-test the S3 and Azure list paths. Tracked in the Rerun dependency disposition
    # register alongside RUSTSEC-2026-0194/0195 for the consuming workspaces.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
