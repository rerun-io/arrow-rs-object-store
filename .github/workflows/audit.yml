name: audit

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      # Rerun fork: consumers pin a `release-*` branch, not `main`, so those branches need
      # the gate more than `main` does.
      - "release-*"
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/audit.yml'
      - 'audit.toml'
  # Advisories are published against unchanged code, so a push-only gate never fires for the
  # case that matters most. This is the trigger that actually catches new findings.
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: "read"

jobs:
  cargo-audit:
    name: Audit (${{ matrix.ref }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A scheduled run only ever executes the default branch's copy of this file, so the
        # branch we actually ship has to be named explicitly or it is never audited.
        ref:
          - main
          - release-0.13.2
    steps:
      - uses: actions/checkout@v6
        with:
          # On push/PR audit the triggering ref; on schedule walk the matrix.
          ref: ${{ github.event_name == 'schedule' && matrix.ref || github.ref }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # This crate does not commit a Cargo.lock (it is in .gitignore, as upstream intends for a
      # library). `cargo audit` resolves one itself, so the audit describes a current resolution
      # rather than a stale pinned one.
      - name: Run audit check
        run: cargo audit
